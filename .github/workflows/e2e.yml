name: E2E Tests

on:
  # Manual trigger saja (karena butuh env production)
  workflow_dispatch:
  # Atau schedule harian jam 2 pagi WIB
  schedule:
    - cron: '0 19 * * *'  # 02:00 WIB (19:00 UTC)

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build project
        run: pnpm run build

      - name: 🚀 Start server in background
        run: |
          NODE_ENV=test pnpm run start:prod &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/v1/health/live > /dev/null; then
              echo "✅ Server is up!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: 🧪 Run E2E tests
        run: pnpm test:e2e
        env:
          TEST_BASE_URL: http://localhost:3000
