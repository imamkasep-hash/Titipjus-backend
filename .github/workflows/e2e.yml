name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build project
        run: pnpm run build

      - name: 📝 Create .env file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          PORT=3000
          APP_URL=http://localhost:3000
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}
          MIDTRANS_IS_PRODUCTION=false
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ALLOWED_ORIGINS=http://localhost:3000
          EOF
          echo "=== .env created (values hidden) ==="
          cat .env | sed 's/=.*/=***/'

      - name: 🚀 Start server in background
        run: |
          nohup node dist/main > server.log 2>&1 &
          echo "Server PID: $!"
          
          echo "=== Waiting for server ==="
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/v1/health/live > /dev/null 2>&1; then
              echo "✅ Server is up after $((i*2))s!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          echo ""
          echo "=== Server log (FULL) ==="
          cat server.log

      - name: 🔍 Verify server is running
        run: |
          echo "=== Test health endpoint ==="
          curl -v http://localhost:3000/api/v1/health/live || true
          echo ""
          echo "=== Port check ==="
          netstat -tlnp | grep 3000 || echo "Port 3000 not listening"
          echo ""
          echo "=== Node processes ==="
          ps aux | grep node | grep -v grep || echo "No node process"

      - name: 🧪 Run E2E tests
        run: pnpm test:e2e
        env:
          TEST_BASE_URL: http://localhost:3000
        continue-on-error: false

      - name: 📋 Show server log on failure
        if: failure()
        run: |
          echo "=== Server log (on failure) ==="
          cat server.log || echo "No server.log"
